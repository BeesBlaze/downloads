name: Build BeesBlaze from encrypted private source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: windows
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare encrypted source privately
        env:
          GH_TOKEN: ${{ github.token }}
          BB_ENCRYPTED_SOURCE_KEY: ${{ secrets.BEESBLAZE_BUILD_SOURCE_KEY }}
        run: |
          python -m pip install cryptography==45.0.7 PyYAML==6.0.2
          gh release download private-build-v0.1.19 --repo BeesBlaze/downloads --pattern BeesBlaze-private-source-0.1.19.enc --output private-source.enc
          python - <<'PY'
          import base64,io,os,tarfile,pathlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          data=pathlib.Path('private-source.enc').read_bytes()
          if data[:7]!=b'BBENC1\0':raise ValueError('Invalid encrypted source.')
          key=base64.urlsafe_b64decode(os.environ['BB_ENCRYPTED_SOURCE_KEY'])
          source=AESGCM(key).decrypt(data[7:19],data[19:],b'BeesBlaze-0.1.19')
          with tarfile.open(fileobj=io.BytesIO(source),mode='r:gz') as archive:archive.extractall(filter='data')
          del source,key
          print('Encrypted source prepared without publishing its contents.')
          PY
      - name: Build and verify native installer
        env:
          GH_TOKEN: ${{ github.token }}
          BB_ENCRYPTED_SOURCE_KEY: ${{ secrets.BEESBLAZE_BUILD_SOURCE_KEY }}
        run: python private_ci.py
