name: Publish BeesBlaze Windows and Mac release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number
        required: true
        type: string
      assets:
        description: JSON array of verified installer download URLs and SHA256 checksums
        required: true
        type: string
      release_notes:
        description: Changes in this version
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      ASSETS: ${{ inputs.assets }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Prepare verified installers and update information
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,urllib.parse,urllib.request,zipfile
          version=os.environ['VERSION']
          if not re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+',version):raise ValueError('Invalid version')
          assets=json.loads(os.environ['ASSETS'])
          if len(assets)!=3 or {a['platform'] for a in assets}!={'windows','arm64','x86_64'}:raise ValueError('Expected Windows and both Mac architectures')
          root=pathlib.Path('dist');root.mkdir()
          manifest={'version':version,'macos':{}};sums=[]
          for asset in assets:
              platform=asset['platform'];expected=asset['sha256'].lower();url=asset['url']
              if not re.fullmatch(r'[0-9a-f]{64}',expected):raise ValueError('Invalid checksum')
              if urllib.parse.urlsplit(url).scheme!='https':raise ValueError('HTTPS required')
              name=f'BeesBlazeVideoEditor-{version}-Windows-Setup.exe' if platform=='windows' else f'BeesBlazeVideoEditor-{version}-Mac-{platform}.dmg'
              archive=pathlib.Path('source-'+platform)
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=180) as response,archive.open('wb') as output:
                  shutil.copyfileobj(response,output,1024*1024)
              target=root/name
              if zipfile.is_zipfile(archive):
                  with zipfile.ZipFile(archive) as z:
                      entries=[e for e in z.infolist() if pathlib.PurePosixPath(e.filename).name==name]
                      if len(entries)!=1:raise ValueError('Expected exactly one matching installer')
                      with z.open(entries[0]) as source,target.open('wb') as output:shutil.copyfileobj(source,output,1024*1024)
              else:archive.rename(target)
              with target.open('rb') as source:checksum=hashlib.file_digest(source,'sha256').hexdigest()
              if checksum!=expected:raise ValueError('Installer checksum mismatch')
              with target.open('rb') as source:
                  if platform=='windows' and source.read(2)!=b'MZ':raise ValueError('Expected Windows executable')
                  if platform!='windows':
                      source.seek(-512,2)
                      if source.read(4)!=b'koly':raise ValueError('Expected Mac disk image')
              public=f'https://github.com/BeesBlaze/downloads/releases/download/v{version}/{name}'
              if platform=='windows':manifest.update(windows_url=public,sha256=checksum)
              else:manifest['macos'][platform]={'url':public,'sha256':checksum}
              sums.append(checksum+'  '+name)
          (root/'update.json').write_text(json.dumps(manifest,indent=2)+chr(10))
          (root/'SHA256SUMS.txt').write_text(chr(10).join(sums)+chr(10))
          pathlib.Path('release-notes.md').write_text(os.environ['RELEASE_NOTES'])
          PY
      - name: Publish BeesBlaze release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --repo BeesBlaze/downloads --title "BeesBlaze $VERSION" --notes-file release-notes.md --latest
