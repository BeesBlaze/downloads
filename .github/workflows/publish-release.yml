name: Publish BeesBlaze Windows and Mac release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number
        required: true
        type: string
      mode:
        description: Release operation
        required: true
        default: publish_urls
        type: choice
        options:
          - publish_urls
          - prepare_draft
          - publish_draft
      assets:
        description: JSON array of verified installer download URLs and SHA256 checksums
        required: false
        type: string
      release_notes:
        description: Changes in this version
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      GH_TOKEN: ${{ github.token }}
      ASSETS: ${{ inputs.assets }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Prepare private draft for verified installer uploads
        if: inputs.mode == 'prepare_draft'
        run: |
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          printf '%s' "$RELEASE_NOTES" > release-notes.md
          gh release create "v$VERSION" --repo BeesBlaze/downloads --draft --title "BeesBlaze $VERSION" --notes-file release-notes.md
      - name: Prepare verified installers and update information
        if: inputs.mode != 'prepare_draft'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,urllib.parse,urllib.request,zipfile,concurrent.futures,subprocess
          version=os.environ['VERSION']
          if not re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+',version):raise ValueError('Invalid version')
          names={'windows':f'BeesBlazeVideoEditor-{version}-Windows-Setup.exe','arm64':f'BeesBlazeVideoEditor-{version}-Mac-arm64.dmg','x86_64':f'BeesBlazeVideoEditor-{version}-Mac-x86_64.dmg'}
          assets=json.loads(os.environ['ASSETS'])
          if len(assets) not in (2,3) or {a['platform'] for a in assets} not in ({'windows','arm64'},{'windows','arm64','x86_64'}):raise ValueError('Expected Windows and Apple Silicon Mac, with optional Intel Mac')
          if os.environ['MODE']=='publish_draft':
              release=json.loads(subprocess.check_output(['gh','release','view',f'v{version}','--repo','BeesBlaze/downloads','--json','isDraft,assets']))
              if not release['isDraft']:raise ValueError('Expected an unpublished draft')
              for item in assets:
                  if sum(a['name']==names[item['platform']] for a in release['assets'])!=1:raise ValueError('Missing draft installer')
          root=pathlib.Path('dist');root.mkdir()
          manifest={'version':version,'macos':{}};sums=[]
          def download(asset):
              platform=asset['platform']
              print('Downloading '+platform,flush=True)
              if os.environ['MODE']=='publish_draft':
                  subprocess.run(['gh','release','download',f'v{version}','--repo','BeesBlaze/downloads','--pattern',names[platform],'--output','source-'+platform],check=True,timeout=180)
              else:
                  url=asset['url']
                  if urllib.parse.urlsplit(url).scheme!='https':raise ValueError('HTTPS required')
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=180) as response,open('source-'+platform,'wb') as output:
                      shutil.copyfileobj(response,output,1024*1024)
              print('Downloaded '+platform,flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(download,assets))
          for asset in assets:
              platform=asset['platform'];expected=asset['sha256'].lower()
              if not re.fullmatch(r'[0-9a-f]{64}',expected):raise ValueError('Invalid checksum')
              name=names[platform]
              archive=pathlib.Path('source-'+platform)
              target=root/name
              if zipfile.is_zipfile(archive):
                  with zipfile.ZipFile(archive) as z:
                      entries=[e for e in z.infolist() if pathlib.PurePosixPath(e.filename).name==name]
                      if len(entries)!=1:raise ValueError('Expected exactly one matching installer')
                      with z.open(entries[0]) as source,target.open('wb') as output:shutil.copyfileobj(source,output,1024*1024)
              else:archive.rename(target)
              with target.open('rb') as source:checksum=hashlib.file_digest(source,'sha256').hexdigest()
              if checksum!=expected:raise ValueError('Installer checksum mismatch')
              with target.open('rb') as source:
                  if platform=='windows' and source.read(2)!=b'MZ':raise ValueError('Expected Windows executable')
                  if platform!='windows':
                      source.seek(-512,2)
                      if source.read(4)!=b'koly':raise ValueError('Expected Mac disk image')
              public=f'https://github.com/BeesBlaze/downloads/releases/download/v{version}/{name}'
              if platform=='windows':manifest.update(windows_url=public,sha256=checksum)
              else:manifest['macos'][platform]={'url':public,'sha256':checksum}
              sums.append(checksum+'  '+name)
          (root/'update.json').write_text(json.dumps(manifest,indent=2)+chr(10))
          (root/'SHA256SUMS.txt').write_text(chr(10).join(sums)+chr(10))
          pathlib.Path('release-notes.md').write_text(os.environ['RELEASE_NOTES'])
          PY
      - name: Publish BeesBlaze release
        if: inputs.mode != 'prepare_draft'
        run: |
          if [ "$MODE" = "publish_draft" ]; then
            gh release upload "v$VERSION" dist/update.json dist/SHA256SUMS.txt --repo BeesBlaze/downloads --clobber
            gh release edit "v$VERSION" --repo BeesBlaze/downloads --draft=false --latest --title "BeesBlaze $VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" dist/* --repo BeesBlaze/downloads --title "BeesBlaze $VERSION" --notes-file release-notes.md --latest
          fi
