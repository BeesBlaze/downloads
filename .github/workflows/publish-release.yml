name: Publish BeesBlaze Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 0.1.16'
        required: true
        type: string
      installer_url:
        description: 'HTTPS URL for the installer or installer ZIP'
        required: true
        type: string
      sha256:
        description: 'SHA256 checksum of the installer EXE'
        required: true
        type: string
      release_notes:
        description: 'Changes in this version'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      INSTALLER_URL: ${{ inputs.installer_url }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Prepare verified installer and update information
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,urllib.parse,urllib.request,zipfile
          version=os.environ['VERSION'];expected=os.environ['EXPECTED_SHA256'].lower()
          if not re.fullmatch(r'[0-9]+([.][0-9]+){1,3}',version):raise ValueError('Invalid version')
          if not re.fullmatch(r'[0-9a-f]{64}',expected):raise ValueError('Invalid SHA256')
          url=os.environ['INSTALLER_URL']
          if urllib.parse.urlsplit(url).scheme!='https':raise ValueError('HTTPS is required')
          name=f'BeesBlazeVideoEditor-{version}-Windows-Setup.exe'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=90) as response,open('installer-source','wb') as out:
              while chunk:=response.read(1024*1024):out.write(chunk)
          root=pathlib.Path('dist');root.mkdir()
          if zipfile.is_zipfile('installer-source'):
              with zipfile.ZipFile('installer-source') as z:
                  entries=[x for x in z.infolist() if pathlib.PurePosixPath(x.filename).name==name]
                  if len(entries)!=1:raise ValueError('Expected exactly one installer')
                  (root/name).write_bytes(z.read(entries[0]))
          else:
              pathlib.Path('installer-source').rename(root/name)
          checksum=hashlib.sha256((root/name).read_bytes()).hexdigest()
          if checksum!=expected:raise ValueError('Installer checksum mismatch')
          with (root/name).open('rb') as exe:
              if exe.read(2)!=b'MZ':raise ValueError('Expected a Windows executable')
          manifest={'version':version,'windows_url':f'https://github.com/BeesBlaze/downloads/releases/download/v{version}/{name}','sha256':checksum}
          (root/'update.json').write_text(json.dumps(manifest,indent=2)+chr(10))
          (root/'SHA256SUMS.txt').write_text(checksum+'  '+name+chr(10))
          pathlib.Path('release-notes.md').write_text(os.environ['RELEASE_NOTES'])
          PY
      - name: Publish BeesBlaze release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --repo BeesBlaze/downloads --title "BeesBlaze $VERSION" --notes-file release-notes.md --latest
